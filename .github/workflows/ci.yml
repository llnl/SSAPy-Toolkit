name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/SSAPy-Data/src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout SSAPy data
        uses: actions/checkout@v4
        with:
          repository: llnl/SSAPy-Data
          ref: 981aa894b4767103220722fe4a6d449e4077a292
          path: SSAPy-Data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e SSAPy-Data
          pip install -e .[dev]

      - name: Validate JavaScript plot assets
        run: |
          node --check ssapy_toolkit/plots/satellite_viewer_scene.js
          node --check ssapy_toolkit/plots/satellite_viewer_smoketest.js

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: pytest tests --junitxml=pytest-${{ matrix.python-version }}.xml

      - name: Report test failures
        if: failure() && matrix.python-version != '3.13'
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("pytest-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is None:
                      continue
                  file_path = case.get("file", "tests")
                  message = (failure.get("message") or failure.text or "test failure").strip()
                  message = message.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error file={file_path},title={case.get('name', 'pytest failure')}::{message}")
          PY

      - name: Run tests with API coverage audit
        if: matrix.python-version == '3.13'
        run: |
          python -m coverage run --branch -m pytest tests
          python -m coverage json -i -o coverage.json
          python scripts/audit_public_api_coverage.py \
            --coverage-json coverage.json \
            --min-hit-pct 95 \
            --require-branch-data
          python scripts/audit_public_api_coverage.py \
            --coverage-json coverage.json \
            --include-private \
            --include-nested \
            --min-hit-pct 90 \
            --min-branch-pct 65 \
            --require-branch-data
