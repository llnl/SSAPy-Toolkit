name: Eclipse checks
on:
  pull_request:
    paths:
      - 'ssapy_toolkit/**/eclipse*.py'
      - 'ssapy_toolkit/plots/eclipse_*.js'
      - 'ssapy_toolkit/plots/moon_*.py'
      - 'demos/eclipse/**'
      - 'tests/test_eclipse*.py'
      - 'tests/test_gcrf_itrf_roundtrip.py'
      - '.github/workflows/eclipse-ci.yml'
  workflow_dispatch:
jobs:
  eclipse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Repository policy
        run: python scripts/check_repository_policy.py
      - name: Eclipse and coordinate tests
        run: >
          python -m pytest -q
          tests/test_eclipse_existing_folders.py
          tests/test_eclipse_integration.py
          tests/test_gcrf_itrf_roundtrip.py
      - name: Package imports with no failures
        run: >
          python -c "import ssapy_toolkit.plots as p, ssapy_toolkit.eclipse;
          f = p.__import_failures__;
          raise SystemExit(f'import failures: {f}') if f else print('imports clean')"
      - name: Eclipse CLI resolves
        run: |
          ssapy-eclipse --help > /dev/null
          ssapy-eclipse audit --output "${RUNNER_TEMP}/audit.json"