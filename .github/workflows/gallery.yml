name: Build Demo Gallery

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/SSAPy-Data/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout SSAPy data
        uses: actions/checkout@v4
        with:
          repository: llnl/SSAPy-Data
          ref: 981aa894b4767103220722fe4a6d449e4077a292
          path: SSAPy-Data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e SSAPy-Data
          pip install -e .[dev]

      - name: Validate JavaScript plot assets
        run: |
          node --check ssapy_toolkit/plots/satellite_viewer_scene.js
          node --check ssapy_toolkit/plots/satellite_viewer_smoketest.js

      - name: Build demo gallery
        env:
          MPLBACKEND: Agg
        run: |
          ssapy-demo-gallery --output site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
