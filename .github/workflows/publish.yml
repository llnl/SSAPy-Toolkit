name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with (Path("pyproject.toml")).open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          test "$RELEASE_TAG" = "v$project_version"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff syntax checks
        run: |
          set -euo pipefail
          base_ref="$(git merge-base origin/main HEAD)"
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$base_ref" HEAD -- '*.py'
          )
          if ((${#python_files[@]})); then
            ruff check --select E9,F63,F7,F82 "${python_files[@]}"
          fi

      - name: Check repository policy
        run: python scripts/check_repository_policy.py --base-ref "$(git merge-base origin/main HEAD)" --head-ref HEAD

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssapy-toolkit
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          pip install --no-deps dist/*.whl
          pip install "llnl-ssapy-data>=0.1.5"
          python -I - <<'PY'
          from importlib.metadata import entry_points

          import ssapy_toolkit
          from ssapy_toolkit.data import data_resource

          assert data_resource("environment/eop/finals2000A.all").is_file()
          assert data_resource("environment/space_weather/SW-All.csv").is_file()
          scripts = {entry.name for entry in entry_points(group="console_scripts")}
          assert {"ssapy-demo-gallery", "ssatk-benchmark", "ssapy-magnetosphere"} <= scripts
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
